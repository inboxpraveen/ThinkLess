# Reference prices used to estimate cost in traces and benchmark reports.
#
# Prices are USD per million tokens. They change; check the source before
# relying on a number, and override this file with your negotiated rates:
#
#   THINKLESS_PRICING=/path/to/pricing.toml
#
# Matching: an entry applies when the provider matches and the model id equals
# `model`, or starts with it when `match = "prefix"`. Local models are free at
# the API level and need no entry; unknown hosted models cost 0 and are
# flagged in the trace as `cost_known = false`.

