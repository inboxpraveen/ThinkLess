version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # ThinkLess is a library: its lower bounds say what it works with, so a
    # new release only needs a pull request when the current range excludes
    # it. The weekly CI run already tests against the newest versions.
    versioning-strategy: increase-if-necessary
    ignore:
      # GLiNER2 requires transformers<5, and every local extra shares that
      # bound so one environment resolves. Lift this once GLiNER2 supports 5.x
      # and the local model tests pass on it.
      - dependency-name: "transformers"
        versions: [">=5"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
