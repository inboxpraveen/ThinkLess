[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "thinkless"
dynamic = ["version"]
description = "The decision plane for AI agents. Rules and small calibrated models make the routine decisions, the LLM is reserved for the steps that need thought, and every step is traced."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Praveen Kumar" }]
keywords = [
  "agents",
  "llm",
  "decision-models",
  "system-one",
  "routing",
  "classification",
  "observability",
  "tracing",
  "jev",
  "laya",
  "gliner",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.6,<3",
  "httpx>=0.27,<1",
  "rich>=13.7",
  "typer>=0.12",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
# Local decision models. GLiNER2 caps transformers below 5, so every local
# extra shares that bound to keep one resolvable environment.
gliner = [
  "gliner2[local]>=2.0,<3",
  "transformers>=4.48,<5",
  "protobuf>=4.25",
  "sentencepiece>=0.2",
]
laya = ["laya>=0.3.20,<0.4", "transformers>=4.48,<5"]
local-llm = ["transformers>=4.48,<5", "accelerate>=1.0", "torch>=2.1"]
local = ["thinkless[gliner,laya,local-llm]"]
# Hosted reasoning backends.
openai = ["openai>=2.0"]
anthropic = ["anthropic>=1.0"]
# Observability export.
otel = [
  "opentelemetry-api>=1.25",
  "opentelemetry-sdk>=1.25",
  "opentelemetry-exporter-otlp-proto-http>=1.25",
]
# Public dataset benchmarks.
bench = ["datasets>=3.0"]
all = ["thinkless[local,openai,anthropic,otel,bench]"]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.10",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.26",
]

[project.urls]
Homepage = "https://github.com/inboxpraveen/ThinkLess"
Documentation = "https://github.com/inboxpraveen/ThinkLess/tree/main/docs"
Repository = "https://github.com/inboxpraveen/ThinkLess"
Issues = "https://github.com/inboxpraveen/ThinkLess/issues"
Changelog = "https://github.com/inboxpraveen/ThinkLess/blob/main/CHANGELOG.md"

[project.scripts]
thinkless = "thinkless.cli.main:app"

[tool.hatch.version]
path = "src/thinkless/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/thinkless"]

[tool.hatch.build.targets.sdist]
include = ["src/thinkless", "tests", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not local and not network'"
markers = [
  "local: needs local model weights and runs real inference (opt in with -m local)",
  "network: calls a hosted API and needs credentials (opt in with -m network)",
]
filterwarnings = ["ignore::DeprecationWarning:typer.*"]

[tool.coverage.run]
source = ["thinkless"]
omit = ["src/thinkless/providers/laya.py", "src/thinkless/providers/gliner.py", "src/thinkless/llm/local.py"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "C4", "PT", "RET"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PT011"]

[tool.mypy]
python_version = "3.12"
packages = ["thinkless"]
mypy_path = "src"
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
ignore_missing_imports = true
